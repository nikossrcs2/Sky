# /etc/nginx/sites-available/frozones
#
# Proxies the Flask dashboard (running on 127.0.0.1:5000)
# for Tor hidden service access at frozones.onion
#
# Install:
#   sudo ln -s /etc/nginx/sites-available/frozones /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name localhost frozones.onion;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Flask app — all routes
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static files — serve directly for speed
    location /static/ {
        alias /home/pi/Sky/dashboard/static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Block anything that looks like a crawler probing for common paths
    location ~* \.(php|asp|aspx|cgi|env|git)$ {
        return 404;
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} — Unknown Error</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .error-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 2rem; }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .04em;
      background: linear-gradient(135deg, var(--ice-2) 0%, var(--muted) 60%, var(--ice-3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }
    .error-code::after {
      content: attr(data-code);
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--ice-2) 0%, var(--muted) 60%, var(--ice-3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: blur(28px);
      opacity: 0.35;
      z-index: -1;
    }
    .error-glyph { font-size: 2.8rem; margin-bottom: 1rem; display: block; animation: glitch 3s infinite; }
    @keyframes glitch {
      0%, 90%, 100% { transform: none; filter: none; }
      92% { transform: translateX(-2px) skewX(-2deg); filter: hue-rotate(90deg); }
      94% { transform: translateX(2px) skewX(2deg); filter: hue-rotate(-90deg); }
      96% { transform: translateX(-1px); filter: none; }
    }
    .error-title { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; color: var(--ice-1); margin: .75rem 0 .5rem; letter-spacing: .05em; }
    .error-sub { color: var(--muted); font-size: .9rem; max-width: 420px; margin: 0 auto 2rem; line-height: 1.7; }
    .error-card { background: var(--card-bg); backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.5rem; margin-bottom: 2rem; font-size: .8rem; color: var(--muted); max-width: 380px; }
    .error-desc { font-size: .78rem; color: var(--muted); }
    .error-actions { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
    .scanline { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px); }
  </style>
</head>
<body>
  <div class="ice-bg"></div>
  <div class="scanline"></div>
  <nav class="topnav">
    <a class="nav-brand" href="/">🍔 FRIEZ</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/friez/">Friez</a>
      <a href="/friez/dashboard/">Dashboard</a>
    </div>
  </nav>
  <main>
    <div class="error-wrap">
      <span class="error-glyph">❓</span>
      <div class="error-code" data-code="{{ code }}">{{ code }}</div>
      <h1 class="error-title">Something Went Wrong</h1>
      <p class="error-sub">Something fell off the grill and we're not sure what. Try going back or heading home.</p>
      <div class="error-card">
        <span class="error-desc">{{ description }}</span>
      </div>
      <div class="error-actions">
        <a href="javascript:history.back()" class="btn-ghost">← Go Back</a>
        <a href="/" class="btn-ice">Return Home</a>
      </div>
    </div>
  </main>
  <footer>
    <span>🍔 Friez Dashboard</span>
    <span>Error {{ code }}</span>
  </footer>
</body>
</html>
